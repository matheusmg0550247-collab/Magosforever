name: Robo Magos - Datas Comemorativas Diarias

on:
  schedule:
    # 06:00 UTC = 03:00 BRT (horario de Brasilia, sem horario de verao).
    # Roda BEM antes das 08:00 BRT para garantir que o webhook chegue ao n8n
    # antes de qualquer scheduler interno do fluxo. Antes era 11:00 UTC e
    # disputava com o checador do n8n, gerando mensagens duplicadas
    # ("Data comemorativa nao encontrada" + depois "...observada").
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Forcar DD/MM (opcional, para teste)"
        required: false
        default: ""

jobs:
  disparar-webhook:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rodar magos_webhook_sender
        env:
          MAGOS_N8N_WEBHOOK: ${{ secrets.MAGOS_N8N_WEBHOOK }}
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python magos_webhook_sender.py --send --date "${{ github.event.inputs.date }}"
          else
            python magos_webhook_sender.py --send
          fi
